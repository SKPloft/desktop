# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# See: https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # ── Rust / Cargo ─────────────────────────────────────────────
  # Updates crates declared in backend/Cargo.toml.
  # The workspace root Cargo.toml is not listed separately because
  # Dependabot follows the workspace resolver automatically.
  - package-ecosystem: "cargo"
    directory: "/backend"
    schedule:
      interval: "weekly"

  # ── JavaScript / TypeScript (npm/Bun) ────────────────────────
  # Updates packages in the root package.json.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"

  # ── GitHub Actions ────────────────────────────────────────────
  # Keeps all `uses:` action pins up to date so we pick up
  # security fixes in upstream actions automatically.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
