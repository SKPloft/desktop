# ============================================================
# Workflow: Edge Build (Rolling / Pre-release)
# ============================================================
#
# PURPOSE:
#   Builds and publishes rolling "edge" pre-release packages to
#   the GitHub "edge" release tag on every push to main.
#   Edge builds are intended for early adopters and testers who
#   want the latest features before a tagged stable release.
#
#   ⚠️  Edge builds are UNSIGNED and UNSTABLE.  They are not
#   recommended for production use.
#
# PIPELINE (3 jobs, jobs 2 runs in parallel after job 1):
#
#   1. create-release   — ensures the rolling "edge" GH release
#                         tag exists and clears old assets
#   2. build-edge       — builds Tauri packages for each platform
#                         and uploads to the "edge" release
#
# TRIGGERS:
#   - push → main
#   - workflow_dispatch — allows manual re-build without a push
#
# CONCURRENCY:
#   One run per workflow + ref combination.
#   A new push cancels the in-progress build.
#
# PLATFORMS (build-edge matrix):
#   - ubuntu-22.04       →  x86_64 Linux (.deb, .rpm, AppImage*)
#   - ubuntu-24.04-arm   →  aarch64 Linux (.deb, .rpm)
#   - macos-latest       →  aarch64 macOS (.app.tar.gz) [unsigned]
#
#   * AppImage files are intentionally skipped in the upload step
#     because they require FUSE and are not bundled by default.
#
# REQUIRED SECRETS:
#   TAURI_SIGNING_PRIVATE_KEY          — your own Ed25519 key used
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD   to sign updater manifests
#     Generate once with: cargo tauri signer generate -w ~/.tauri/key
#     Then add both values to GitHub repo secrets.
#
#   GITHUB_TOKEN — auto-provided; used to create/edit the GH release
#
# OPTIONAL (currently disabled — see TBD block below):
#   APPLE_CERTIFICATE          — base64-encoded .p12 certificate
#   APPLE_CERTIFICATE_PASSWORD — certificate passphrase
#   APPLE_ID                   — Apple ID email
#   APPLE_PASSWORD             — App-specific password
#   APPLE_SIGNING_IDENTITY     — e.g. "Developer ID Application: ..."
#   APPLE_TEAM_ID              — 10-character Apple team identifier
#
# TOOLS USED:
#   - Bun           (oven-sh/setup-bun)        — JS package manager
#   - Node.js LTS   (actions/setup-node)        — required by tauri-action
#   - Rust stable   (dtolnay/rust-toolchain)   — Rust compiler
#   - Rust cache    (swatinem/rust-cache)       — speeds up incremental builds
#   - Tauri build   (tauri-apps/tauri-action)  — bundles the desktop app
#   - GitHub CLI    (gh, bundled)              — uploads release assets
# ============================================================

name: edge

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_ENV: production
  APP_CHANNEL: edge

jobs:
  # ─────────────────────────────────────────────────────────────
  # Job 1: create-release
  # Ensures the "edge" pre-release tag exists on GitHub.
  # If it already exists, the release notes are updated and all
  # stale assets are deleted so only the latest build is present.
  # ─────────────────────────────────────────────────────────────
  create-release:
    name: Ensure edge release exists
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # ── 1. Checkout ───────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Create or update the rolling "edge" release ────────
      - name: Create or update "edge" GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="**⚠️ Rolling edge build — unstable, use at your own risk**

          Updated with commit: ${{ github.sha }}
          Latest commit message: ${{ github.event.head_commit.message }}

          These packages are unsigned. See the [README](https://github.com/${{ github.repository }}/blob/main/README.md) for installation instructions."

          if gh release view edge > /dev/null 2>&1; then
            echo "Edge release exists — updating notes and clearing old assets..."
            gh release edit edge --notes "$NOTES"

            # Delete all existing assets so outdated builds don't accumulate
            gh release view edge --json assets \
              | jq -r '.assets[].name' \
              | while read name; do
                  echo "  Deleting old asset: $name"
                  gh release delete-asset edge "$name" -y
                done
          else
            echo "Creating new edge release..."
            gh release create edge \
              --title "Edge Release (Rolling)" \
              --notes "$NOTES" \
              --prerelease \
              --latest=false
          fi

  # ─────────────────────────────────────────────────────────────
  # Job 2: build-edge
  # Builds the Tauri application for each supported platform and
  # uploads the packaged artifacts to the "edge" GH release.
  # ─────────────────────────────────────────────────────────────
  build-edge:
    name: Build edge (${{ matrix.platform }})
    needs: create-release
    permissions:
      contents: write

    strategy:
      fail-fast: false   # Allow all platforms to finish even if one fails
      matrix:
        include:
          - platform: "ubuntu-22.04"
            args: ""
          - platform: "ubuntu-24.04-arm"
            args: "--target aarch64-unknown-linux-gnu"
          - platform: "macos-latest"
            # Builds for Apple Silicon (M1+).
            # NOTE: macOS builds are currently UNSIGNED.
            #       See the TBD block inside the tauri-action step.
            args: "--target aarch64-apple-darwin"

    runs-on: ${{ matrix.platform }}

    steps:
      # ── 1. Checkout ───────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Install Linux system dependencies ─────────────────
      #   Only required on Linux. macOS has WebKit bundled.
      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04' || matrix.platform == 'ubuntu-24.04-arm'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libasound2-dev

      # ── 3. Set up Bun ─────────────────────────────────────────
      #   Bun handles JS/TS dependency installation.
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # ── 4. Set up Node.js LTS ─────────────────────────────────
      #   tauri-apps/tauri-action requires Node.js to be present
      #   alongside Bun for its internal scripts.
      - name: Set up Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      # ── 5. Install Rust stable ───────────────────────────────
      #   The cross-compile target is only set for platforms that
      #   need it (macOS aarch64, Linux arm64).
      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || (matrix.platform == 'ubuntu-24.04-arm' && 'aarch64-unknown-linux-gnu' || '') }}

      # ── 6. Cache Rust build artifacts ────────────────────────
      #   Significantly speeds up incremental builds after small
      #   code changes.
      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2

      # ── 7. Install JS/TS dependencies ─────────────────────────
      - name: Install frontend dependencies
        run: bun install

      # ── 8. Stamp edge version into Cargo.toml ─────────────────
      #   Appends the short commit SHA to the semver version so
      #   edge artifacts are clearly distinguishable from stable
      #   releases (e.g. "0.3.0-beta.2-a1b2c3d").
      - name: Stamp edge version (version-commitSHA)
        id: update-edge-version
        run: |
          version=$(grep -m 1 '^version = ' Cargo.toml \
            | sed 's/version = "\([^"]*\)".*/\1/')
          commit_sha=$(git rev-parse --short HEAD)
          new_version="${version}-${commit_sha}"

          # Update root and backend Cargo.toml in-place
          sed -i.bak "s/^version = \"${version}\"/version = \"${new_version}\"/" Cargo.toml
          sed -i.bak "s/^version = \"${version}\"/version = \"${new_version}\"/" backend/Cargo.toml

          echo "new_version=${new_version}" >> $GITHUB_OUTPUT
          echo "Stamped version: ${new_version}"

      # ── 9. Build with Tauri ───────────────────────────────────
      - name: Build Tauri application
        id: tauri-action
        uses: tauri-apps/tauri-action@v0
        env:
          # Updater signing keys — required for Tauri's auto-updater to
          # validate packages.  Generate your own key pair once with:
          #   cargo tauri signer generate -w ~/.tauri/key
          # Then add TAURI_SIGNING_PRIVATE_KEY and
          # TAURI_SIGNING_PRIVATE_KEY_PASSWORD to your repo secrets.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

          # Node.js heap limit — needed for large front-end builds
          NODE_OPTIONS: "--max-old-space-size=6144"

          IS_EDGE_BUILD: true

          # ── TBD: Apple Code Signing ─────────────────────────
          # To enable macOS code signing and notarisation, add the
          # following secrets to your GitHub repository and uncomment:
          #
          # APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          # APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          # APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # TAURI_BUNDLER_DMG_IGNORE_CI: false
          #
          # See: https://tauri.app/distribute/sign/macos/
        with:
          args: ${{ matrix.args }}

      # ── 10. Upload artifacts to "edge" GitHub release ─────────
      #   Renames platform-specific filenames for clarity, then
      #   uploads to the rolling "edge" pre-release.
      #
      #   Skipped file types:
      #     .app   — raw macOS app bundle (too large, use .app.tar.gz)
      #     .AppImage — optional; skipped to keep release lean
      - name: Rename and upload artifacts to "edge" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Artifacts produced: ${{ steps.tauri-action.outputs.artifactPaths }}"

          # Parse the JSON array of artifact paths
          paths_str=$(echo "${{ steps.tauri-action.outputs.artifactPaths }}" \
            | sed 's/^\[//;s/\]$//')
          IFS=',' read -ra paths <<< "$paths_str"

          # Determine if we need a platform suffix (macOS aarch64 builds)
          platform_suffix=""
          if [[ "${{ matrix.args }}" == *"aarch64-apple-darwin"* ]]; then
            platform_suffix="-aarch64"
          fi

          for file in "${paths[@]}"; do
            file="${file// /}"   # trim any stray whitespace
            echo "Processing: $file"

            if [[ "$file" == *.deb ]] || [[ "$file" == *.rpm ]]; then
              # Normalise spaces in Linux package filenames
              dir=$(dirname "$file")
              filename=$(basename "$file")
              new_filename=$(echo "$filename" | sed 's/ /_/g')

              if [[ "$filename" != "$new_filename" ]]; then
                mv "$file" "$dir/$new_filename"
                gh release upload "edge" "$dir/$new_filename" --clobber
              else
                gh release upload "edge" "$file" --clobber
              fi

            elif [[ "$file" == *.app.tar.gz ]] || [[ "$file" == *.app.tar.gz.sig ]]; then
              # Append platform suffix to macOS update bundles
              if [[ -n "$platform_suffix" ]]; then
                dir=$(dirname "$file")
                filename=$(basename "$file")
                if [[ "$file" == *.app.tar.gz.sig ]]; then
                  new_filename=$(echo "$filename" \
                    | sed "s/\.app\.tar\.gz\.sig$/${platform_suffix}.app.tar.gz.sig/")
                else
                  new_filename=$(echo "$filename" \
                    | sed "s/\.app\.tar\.gz$/${platform_suffix}.app.tar.gz/")
                fi
                mv "$file" "$(dirname "$file")/$new_filename"
                gh release upload "edge" "$(dirname "$file")/$new_filename" --clobber
              else
                gh release upload "edge" "$file" --clobber
              fi

            elif [[ "$file" == *.app ]]; then
              echo "Skipping raw .app bundle (use .app.tar.gz instead): $file"

            elif [[ "$file" == *.AppImage ]]; then
              echo "Skipping AppImage (not distributed in edge builds): $file"

            else
              gh release upload "edge" "$file" --clobber
            fi
          done
