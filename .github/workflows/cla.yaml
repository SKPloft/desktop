# ============================================================
# Workflow: CLA Assistant
# ============================================================
#
# PURPOSE:
#   Enforces the Contributor License Agreement (CLA) on every
#   pull request.  Contributors must sign the CLA exactly once;
#   their signature is committed to the `cla-signatures` branch
#   so it persists across PRs.
#
#   The bot is triggered when:
#     a) A new PR is opened / updated (pull_request_target)
#     b) A commenter writes exactly the magic phrase below
#        (case-sensitive):
#          "I have read the CLA Document and I hereby sign the CLA"
#     c) A maintainer writes "recheck" to re-run the check on
#        an existing PR.
#
#   The CLA document itself lives at: ./CLA.md in this repository.
#
# TRIGGERS:
#   - issue_comment: created
#   - pull_request_target: opened, closed, synchronize
#
# REQUIRED SECRETS:
#   GITHUB_TOKEN — auto-provided by GitHub Actions (no setup needed)
#
# REQUIRED PERMISSIONS (set explicitly to avoid repo-default "read-only"):
#   actions:       write  (re-run CLA check workflow)
#   contents:      write  (commit signature file to cla-signatures branch)
#   pull-requests: write  (post status comments on PRs)
#   statuses:      write  (set commit status checks)
#
# ALLOWLIST:
#   bot*   — all GitHub bot accounts (e.g. dependabot) are exempt
#   claude — the Claude AI code assistant account is exempt
#
# TOOL USED:
#   contributor-assistant/github-action@v2.6.1
#     Open-source CLA/DCO assistant.
#     https://github.com/contributor-assistant/github-action
# ============================================================

name: "CLA Assistant"

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

# Explicitly set permissions so this works even if the repository
# default is "read-only" for GITHUB_TOKEN.
permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  CLAAssistant:
    runs-on: ubuntu-latest
    steps:
      # ── CLA check ────────────────────────────────────────────
      #   Runs only when:
      #     • a PR is opened/updated (pull_request_target), OR
      #     • a commenter types the exact sign-off phrase, OR
      #     • a maintainer types "recheck"
      - name: "CLA Assistant"
        if: |
          github.event.comment.body == 'recheck' ||
          github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA' ||
          github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Path within this repository where signatures are stored.
          # Branch "cla-signatures" is created automatically if absent.
          path-to-signatures: "signatures/version1/cla.json"

          # Always point to the CLA document in THIS repository so we
          # don't depend on any external or private repository URL.
          path-to-document: "https://github.com/${{ github.repository }}/blob/main/CLA.md"

          # The branch that stores the signature JSON file.
          # Must NOT be a protected branch.
          branch: "cla-signatures"

          # Accounts that are automatically exempt from signing.
          # "bot*" covers dependabot, github-actions[bot], etc.
          allowlist: bot*,claude
