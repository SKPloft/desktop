# ============================================================
# Workflow: Build atuin-run (Binary Release)
# ============================================================
#
# PURPOSE:
#   Builds the `atuin-run` runbook-runner binary and uploads it
#   as an asset to the GitHub "atuin-run-latest" release tag so
#   other workflows and contributors can download it without
#   needing to compile it locally.
#
# TRIGGERS:
#   - Push to `main` when any of these paths change:
#       crates/atuin-run/**
#       crates/atuin-desktop-runtime/**
#       .github/workflows/atuin-run-release.yaml
#
# MATRIX:
#   - ubuntu-22.04  →  x86_64-unknown-linux-gnu
#   - macos-latest  →  aarch64-apple-darwin
#
# REQUIRED SECRETS:
#   (none — uses the built-in GITHUB_TOKEN)
#
# REQUIRED VARS:
#   (none)
#
# TOOLS USED:
#   - Rust stable      (dtolnay/rust-toolchain)
#   - sccache          (mozilla-actions/sccache-action) — Rust compiler cache
#   - GitHub CLI (gh)  — bundled in all GitHub-hosted runners
# ============================================================

name: Build atuin-run

on:
  push:
    branches: [main]
    paths:
      - "crates/atuin-run/**"
      - "crates/atuin-desktop-runtime/**"
      - ".github/workflows/atuin-run-release.yaml"

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build and Upload (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - platform: macos-latest
            target: aarch64-apple-darwin

    runs-on: ${{ matrix.platform }}

    permissions:
      # Required to upload assets to GitHub releases
      contents: write

    steps:
      # ── 1. Checkout source ───────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Install Rust stable ───────────────────────────────
      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      # ── 3. Enable sccache compiler cache ─────────────────────
      #   sccache caches compiled Rust artifacts so repeated
      #   builds (e.g. after small changes) complete much faster.
      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.7

      # ── 4. Build the binary ───────────────────────────────────
      - name: Build atuin-run (release)
        env:
          RUSTC_WRAPPER: sccache
        run: cargo build --release --package atuin-run

      # ── 5. Upload binary to GitHub Releases ───────────────────
      #   We publish to a rolling "atuin-run-latest" pre-release
      #   so downstream workflows can download the binary via the
      #   public GitHub releases API without any cloud credentials.
      #
      #   The release tag is re-created/updated on every push so
      #   it always points to the most recent build from main.
      - name: Publish binary to GitHub release (atuin-run-latest)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BINARY_NAME="atuin-run-${{ matrix.target }}"

          # Rename binary to include target triple for disambiguation
          cp target/release/atuin-run "$BINARY_NAME"

          # Create the rolling tag/release if it doesn't exist yet
          if ! gh release view atuin-run-latest > /dev/null 2>&1; then
            gh release create atuin-run-latest \
              --title "atuin-run (latest build from main)" \
              --notes "Rolling build of the atuin-run binary from the main branch.
          Used by CI to execute runbooks without requiring a local Rust install.
          Assets are updated automatically on every relevant push to main." \
              --prerelease \
              --latest=false
          fi

          # Upload (or replace) the binary asset
          gh release upload atuin-run-latest "$BINARY_NAME" --clobber
